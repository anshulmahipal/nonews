name: Create Production Builds

on:
  push:
    branches:
      - main
      - development

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production
      working_directory: apps/expo

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
      working_directory: apps/expo
