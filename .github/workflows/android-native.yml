name: Android Native Build
# Produces a signed release AAB (Android App Bundle) from apps/expo/android via ./gradlew bundleRelease.
# Runs expo prebuild for Android unless you dispatch with skip_expo_prebuild and commit apps/expo/android.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_VERSION_CODE_BASE: "1000000"

on:
  push:
    branches:
      - main
      - development
      - "release/**"
    paths:
      - "apps/expo/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:
    inputs:
      skip_expo_prebuild:
        description: "Skip expo prebuild — only if apps/expo/android is committed to the repo"
        required: false
        default: false
        type: boolean

jobs:
  android:
    runs-on: ubuntu-latest
    # Avoid hanging until the default 6h job limit; native + Gradle should finish well under this.
    timeout-minutes: 120
    # Required so secrets stored under Settings → Environments → Production are available.
    environment: Production
    defaults:
      run:
        shell: bash
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Expo lib sources are tracked
        run: |
          test -f apps/expo/lib/supabase.ts || {
            echo "Missing apps/expo/lib/supabase.ts — ensure root .gitignore allows apps/expo/lib/** and commit those files."
            exit 1
          }
          test -f apps/expo/lib/googleSignIn.ts || {
            echo "Missing apps/expo/lib/googleSignIn.ts — commit apps/expo/lib/ from your machine."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup npm
        run: npm install --global npm@10.9.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Keep this in sync with the Gradle wrapper version generated by Expo prebuild.
          # Installing/caching Gradle here keeps the release build from depending on wrapper bootstrap.
          gradle-version: "8.14.3"

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/android-cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
            mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f package-lock.json || { echo "No package-lock.json at repo root — run: npx npm@10.9.0 install"; exit 1; }
          node --version
          npm --version
          # `npm ci` fails when package-lock.json is even slightly out of sync with workspace package.json files
          # (common after dependency edits without a fresh lockfile). `npm install` reconciles the tree reliably on CI.
          npm install --no-audit --no-fund

      - name: Compute Android versionCode
        run: |
          set -euo pipefail
          version_code=$((ANDROID_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Using Android versionCode: $version_code"

      - name: Generate native Android project (apps/expo/android)
        if: ${{ !((github.event_name == 'workflow_dispatch') && github.event.inputs.skip_expo_prebuild) }}
        run: npm --workspace @nonews/expo run prebuild:android

      - name: Verify committed apps/expo/android
        if: ${{ (github.event_name == 'workflow_dispatch') && github.event.inputs.skip_expo_prebuild }}
        run: |
          test -f apps/expo/android/settings.gradle || {
            echo "skip_expo_prebuild was set but apps/expo/android is missing. Commit the native project or remove android/ from .gitignore and push."
            exit 1
          }

      - name: Raise Gradle wrapper network timeout
        working-directory: apps/expo/android
        run: |
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' gradle/wrapper/gradle-wrapper.properties
          else
            printf '\nnetworkTimeout=60000\n' >> gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Decode release keystore
        run: |
          mkdir -p apps/expo/android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/expo/android/keystore/release.keystore

      - name: Validate release signing secrets
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Build signed release AAB
        working-directory: apps/expo/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          # Skip entire lint-vital pipeline on CI (library analyze/report often fail or hang). You must also skip
          # :app:lintVitalRelease — excluding only analyze/report leaves that task running without their outputs.
          # Use the Gradle binary installed by `setup-gradle` to avoid wrapper bootstrap/download timeouts on CI.
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/expo/android/keystore/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/expo/android/app/build/outputs/bundle/release/app-release.aab
