name: Android Native Build
# This workflow is intentionally committed from time to time to retrigger Android CI on GitHub.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  push:
    branches:
      - main
      - development
    paths:
      - "apps/expo/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Artifact type to build"
        required: true
        default: "debug-apk"
        type: choice
        options:
          - debug-apk
          - release-apk
          - release-aab

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'debug-apk' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/android-cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
            mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npm --workspace @nonews/expo run prebuild:android

      - name: Decode release keystore
        if: env.BUILD_PROFILE != 'debug-apk' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p apps/expo/android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/expo/android/keystore/release.keystore

      - name: Validate release signing secrets
        if: env.BUILD_PROFILE != 'debug-apk'
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Build debug APK
        if: env.BUILD_PROFILE == 'debug-apk'
        working-directory: apps/expo/android
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        if: env.BUILD_PROFILE == 'release-apk'
        working-directory: apps/expo/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/expo/android/keystore/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build signed release AAB
        if: env.BUILD_PROFILE == 'release-aab'
        working-directory: apps/expo/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/expo/android/keystore/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload debug APK
        if: env.BUILD_PROFILE == 'debug-apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/expo/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: env.BUILD_PROFILE == 'release-apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        if: env.BUILD_PROFILE == 'release-aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/expo/android/app/build/outputs/bundle/release/app-release.aab
